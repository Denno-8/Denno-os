<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Denno — Career OS</title>
    <meta name="description" content="Denno Career OS — Your personal career intelligence and automation platform." />

    <!-- Google Fonts Preconnect and Stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Security meta tags (defence-in-depth; primary headers are set server-side) -->
    <!-- Fallback CSP — connect-src must allow the backend API origin in both development and production -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 ws://localhost:* ws://127.0.0.1:*; object-src 'none'; frame-ancestors 'none';" />
    <!-- Prevent sending full URL to third-party sites -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body style="background-color: #0b1120; margin: 0;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b1120; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color: #ffffff;">
        <div style="width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, #2563eb, #1e40af); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 26px; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4); margin-bottom: 16px;">
          D
        </div>
        <div style="font-size: 18px; font-weight: 800; tracking-style: tight; color: #f8fafc; margin-bottom: 6px;">Denno</div>
        <div style="font-size: 11px; font-weight: 700; color: #60a5fa; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 24px;">Career Intelligence OS</div>
        <div style="width: 24px; height: 24px; border: 2.5px solid rgba(255, 255, 255, 0.15); border-top-color: #3b82f6; border-radius: 50%; animation: denno-spin 0.8s linear infinite;"></div>
        <style>
          @keyframes denno-spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
