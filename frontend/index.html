    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- ═══════════════════════════════════════════════
         SECURITY META TAGS
    ═══════════════════════════════════════════════ -->
    <!-- NOTE: frame-ancestors is intentionally absent from this meta tag.
         Per the CSP spec browsers IGNORE frame-ancestors in <meta> elements.
         It is enforced via the Content-Security-Policy HTTP header set in
         vercel.json (production) and vite.config.ts (dev). -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://denno-backend.onrender.com https://*.onrender.com https: http://localhost:8000 http://127.0.0.1:8000 ws://localhost:* ws://127.0.0.1:*; object-src 'none';" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- ═══════════════════════════════════════════════

         Helps Google understand the app type & display rich results
    ═══════════════════════════════════════════════ -->

        "Interview Preparation",
        "Career Goals Tracking",

      ],

      "creator": {
        "@type": "Organization",
        "name": "Denno Career OS",
        "url": "https://denno.app"
      },
      "inLanguage": "en-KE",
      "audience": {
        "@type": "Audience",
        "audienceType": "Job seekers, Professionals, Graduates in Kenya and Africa"
      }
    }
    </script>
