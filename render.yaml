# render.yaml — Denno Career OS · Render Blueprint
# ──────────────────────────────────────────────────────────────────────────────
# Deploy everything in one click from the Render dashboard:
#   https://dashboard.render.com/select-repo → "Use a Blueprint"
#
# Services provisioned:
#   • denno-backend  — FastAPI (Python 3.12, Docker)
#   • denno-db       — PostgreSQL 16
#   • denno-redis    — Redis 7
# ──────────────────────────────────────────────────────────────────────────────

databases:
  - name: denno-db
    databaseName: denno
    user: denno_user
    plan: free          # Upgrade to starter/standard for persistent storage

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  - type: web
    name: denno-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: free          # Upgrade for always-on (free tier sleeps after 15 min idle)
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ── App
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO

      # ── Database — auto-wired from the database above
      # start.sh converts postgres:// → postgresql+asyncpg:// at runtime
      - key: DATABASE_URL
        fromDatabase:
          name: denno-db
          property: connectionString

      # ── Redis (Paste URL from existing Render Redis or Upstash)
      - key: REDIS_URL
        sync: false

      # ── Security
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: true

      # ── CORS — Vercel frontend URL
      - key: FRONTEND_ORIGIN
        value: https://denno-luv9egm9c-denno-8s-projects.vercel.app

      # ── Allowed hosts (update with your actual subdomain after first deploy)
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost"

      # ── AI (add your key in Render dashboard env vars)
      - key: ANTHROPIC_API_KEY
        value: ""

      # ── Email
      - key: EMAILS_ENABLED
        value: false
