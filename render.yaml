# render.yaml — Denno Career OS · Render Blueprint
# ──────────────────────────────────────────────────────────────────────────────
# Deploy everything in one click from the Render dashboard:
#   https://dashboard.render.com/select-repo → "Use a Blueprint"
#
# Services provisioned:
#   • denno-backend  — FastAPI (Python 3.12, Docker)
#   • denno-db       — PostgreSQL 16
#   • denno-redis    — Redis 7
# ──────────────────────────────────────────────────────────────────────────────

databases:
  - name: denno-db
    databaseName: denno
    user: denno_user
    plan: free          # Upgrade to starter/standard for persistent storage

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  - type: web
    name: denno-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: free          # Upgrade for always-on (free tier sleeps after 15 min idle)
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ── App
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO

      # ── Database — auto-wired from the database above
      # start.sh converts postgres:// → postgresql+asyncpg:// at runtime
      - key: DATABASE_URL
        fromDatabase:
          name: denno-db
          property: connectionString

      # ── Redis
      # Your previous Redis instance (red-dak3rbm743jc73fsf470) no longer exists.
      # Fix options (pick ONE):
      #
      # OPTION A — New Render Redis (Free, internal URL, same region required):
      #   1. Render Dashboard → New → Redis → Free plan → same region as backend
      #   2. After creation, go to Redis service → copy "Internal Redis URL"
      #      It looks like: redis://red-xxxxxxxxxxxxxxxxxxxx:6379
      #   3. Paste it as REDIS_URL below or in the backend service env vars
      #
      # OPTION B — Upstash Redis (Free, works cross-region, TLS):
      #   1. Sign up at https://upstash.com (free)
      #   2. Create a Redis database → copy "UPSTASH_REDIS_URL" (rediss://...)
      #   3. Paste it as REDIS_URL below
      #
      # NOTE: Redis is optional. Without it, token revocation, rate-limiting,
      # and SSE notifications are gracefully disabled. Password reset still works.
      - key: REDIS_URL
        sync: false   # Paste your new Redis URL here in Render dashboard

      # ── Security
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: true

      # ── CORS — Vercel frontend URL
      # IMPORTANT: Update this to your actual Vercel deployment URL after first deploy.
      # To find it: Vercel dashboard → your project → Deployments → copy the production URL.
      - key: FRONTEND_ORIGIN
        sync: false   # Set manually in Render dashboard: https://your-project.vercel.app

      # ── Allowed hosts (covers all Render subdomains)
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"

      # ── AI (add your key in Render dashboard env vars)
      - key: ANTHROPIC_API_KEY
        sync: false

      # ── Brevo (Outbound Applications over HTTPS port 443 — bypasses Render SMTP port blocks)
      - key: BREVO_API_KEY
        sync: false     # Get API key at https://app.brevo.com/settings/keys/api (xkeysib-...)
      - key: BREVO_FROM_EMAIL
        sync: false     # Verified sender email in Brevo (e.g. yourname@gmail.com)

      # ── Gmail IMAP (Inbound Response Syncing — reads recruiter replies)
      - key: IMAP_USER
        sync: false     # Candidate's Gmail address (e.g. yourname@gmail.com)
      - key: IMAP_PASSWORD
        sync: false     # 16-char Gmail App Password from https://myaccount.google.com/apppasswords

      # ── Email / SMTP (Direct fallback)
      - key: EMAILS_ENABLED
        value: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        sync: false     # e.g. yourname@gmail.com
      - key: SMTP_PASSWORD
        sync: false     # 16-char Gmail App Password (no spaces)
      - key: SMTP_FROM_EMAIL
        sync: false     # MUST be same as SMTP_USER for Gmail
      - key: SMTP_FROM_NAME
        value: "Denno Career OS"
      - key: SMTP_USE_SSL
        value: true     # true when using port 465
      - key: SMTP_TLS
        value: false    # false when using port 465 (STARTTLS not needed)

      # ── Bot Shield / CAPTCHA (optional — leave blank to disable)
      - key: TURNSTILE_SECRET_KEY
        sync: false
