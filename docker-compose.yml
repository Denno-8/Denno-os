version: '3.8'

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: denno_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-denno_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-denno}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-denno}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - denno_network

  # ── Redis Cache & Broker ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: denno_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel notice
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - denno_network

  # ── FastAPI Backend API ─────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: denno_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-denno_secure_password_2026}@postgres:5432/${POSTGRES_DB:-denno}
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - denno_network

  # ── Celery Background Worker ────────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: denno_celery_worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-denno_secure_password_2026}@postgres:5432/${POSTGRES_DB:-denno}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
    networks:
      - denno_network

  # ── Celery Beat Scheduler ───────────────────────────────────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: denno_celery_beat
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-denno_secure_password_2026}@postgres:5432/${POSTGRES_DB:-denno}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      celery_worker:
        condition: service_started
    networks:
      - denno_network

  # ── Frontend (Nginx SPA + Reverse Proxy) ────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: denno_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - denno_network

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

networks:
  denno_network:
    driver: bridge
